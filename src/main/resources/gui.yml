    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: '&#FF0000ᴄᴀɴᴄᴇʟ'
    lore:
      - '&fClick to cancel'
  display:
    slot: 13
    material: YELLOW_DYE
    name: '&#FFEB00ʜᴏᴍᴇ %home%'
    lore: []
  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: '&aᴄᴏɴғɪʀᴍ'
    lore:
      - '&fClick to delete'
