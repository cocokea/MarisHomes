name: Discord Commit Notify

on:
  push:
    branches:
      - "**"

jobs:
  notify:
    if: ${{ secrets.MARIS_DISCORD_WEBHOOK != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notification
        env:
          WEBHOOK_URL: ${{ secrets.MARIS_DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          payload=$(jq -n \
            --arg username "Maris Updates" \
            --arg content "" \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg url "$COMMIT_URL" \
            --arg message "$COMMIT_MESSAGE" \
            --arg author "$COMMIT_AUTHOR" \
            '{
              username: $username,
              embeds: [
                {
                  title: "New Commit Pushed",
                  color: 6225855,
                  fields: [
                    { name: "Repository", value: $repo, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Commit", value: ("`" + $sha + "`"), inline: true },
                    { name: "Author", value: $author, inline: true },
                    { name: "Message", value: $message, inline: false },
                    { name: "Open", value: $url, inline: false }
                  ]
                }
              ]
            }')
          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK_URL" >/dev/null
